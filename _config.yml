# Site settings
title: umt.world
description: A hypertext project by Uriah Marc Todoroff
author:
  name: Uriah Marc Todoroff
  email: umt@umt.world
twitter:
  username: theinvertedform
  card: summary
github_username: theinvertedform
baseurl: ""
url: "https://umt.world"
permalink: /:title
logo: /assets/images/logo.png
repository: theinvertedform/umt.world

# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-pandoc
  - jekyll-redirect-from
  - jekyll-last-modified-at
  - jekyll-github-metadata

last-modified-at:
  date-format: "%b %-d, %Y"

markdown: Pandoc

pandoc:
  version: "3.10"
  format: html5
  extensions:
    - csl: "assets/csl/chicago-notes-bibliography.csl"
    - bibliography: "collections/bibliography.bib"
    - lua-filter: "_plugins/entities.lua" # this needs to come before citeproc
    - citeproc
    - lua-filter: "_plugins/metadata-headings.lua" # this needs to come after citeproc
    - from: "markdown+gfm_auto_identifiers"
    - section_divs
    - shift-heading-level-by: "1"
    - wrap: "none"
    - lua-filter: "_plugins/diary-dates.lua"

# Collections
collections_dir: "collections/"
collections:
  books:
    output: true
    permalink: "/books/:title"
  criticism:
    output: true
    permalink: "/criticism/:title"
  culture:
    output: true
    permalink: "/culture/:title"
  fiction:
    output: true
    permalink: "/fiction/:title"
  interviews:
    output: true
    permalink: "/interviews/:title"
  newsletter:
    output: true
    permalink: "/newsletter/:year/:month/:day"
  personal:
    output: true
    permalink: "/:title"
  podcast:
    output: false
    permalink: "/podcast#:title"
  diaries:
    output: false
    permalink: "/diaries"

defaults:
  - scope:
      path: ""
    values:
      layout: "post"

google_analytics: G-5NHX2XP9H3

backlinks:
  excluded_backlink_pages:
    - "index.html"
    - "/index"
    - "changes.html"
    - "404.html"
    - "tags.html"
    - "/tags"
  excluded_id_elements:
    - "#sidebar"
    - ".sidebar-links"
    - "footer"
    - "#page-tags"
    - "#backlinks"
  context:
    chars_before: 100
    chars_after: 100
  output_dir: "_data/backlinks"
  debug: true

listmonk:
  form_action: https://news.umt.world/subscription/form
  list_uuid: ccc90a84-c1eb-44be-b379-7a4a29b750c5
  list_name: umt.world

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - assets/node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - bower.json
  - bower_components/
  - collections/archive
  - collections/pdfs
  - collections/notes
  - collections/publications
  - _fiction/
  - collections/.gitignore
  - collections/.git
  - _culture/film-diary/
  - package-lock.json
  - package.json
