<!DOCTYPE html>
<html lang="en-GB">

	{% include head.html %}

	{% if page.title == 'Index' %}
    <body class="page-index" itemscope itemtype="https://schema.org/WebPage">
	{% else %}
    <body itemscope itemtype="https://schema.org/WebPage">
	{% endif %}

		<main>

			{% include nav.html %}

		{{ content }}

		{% include footer.html %}

		</main>

		<!-- Google Analytics -->
		{% if site.google_analytics and jekyll.environment == 'production' %}
		<script src="{{ '/assets/js/analytics.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/google-analytics.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/analytics.js' | relative_url }}"></script>
		<script>
			// Clean _gl parameter from URL after GA4 processes it
			if (window.location.search.includes('_gl=')) {
			  setTimeout(() => {
			    const url = new URL(window.location);
			    url.searchParams.delete('_gl');
			    window.history.replaceState({}, '', url);
			  }, 100);
			}
		</script>
		{% endif %}
    </body>
</html>
